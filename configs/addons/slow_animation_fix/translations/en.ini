config_invalid = Invalid SlowAnimationFix config or translation file; the complete package is required and a failed reload keeps previous settings.
schema_unavailable = Player controller schema unavailable; empty-server reload is disabled until the next map starts.
utils_unavailable = IUtilsApi unavailable; empty-server checks are paused.
hooks_unavailable = MetaMod API18 rejected KHook registration; the plugin was not loaded.
unload_busy = A SlowAnimationFix callback is active or KHook is unavailable; unload refused.
map_invalid = Missing or unsafe map name; reload disabled.
reloading = Empty server: reloading the current map to reset animation time.
restoring = Restored the remaining mp_timelimit after reloading the same map.
