config_invalid = Некорректный конфиг SlowAnimationFix или файл перевода; требуется полный пакет, при перезагрузке сохранены предыдущие настройки.
schema_unavailable = Схема контроллера игрока недоступна; перезагрузка пустого сервера отключена до следующего запуска карты.
utils_unavailable = IUtilsApi недоступен; проверка пустого сервера приостановлена.
hooks_unavailable = MetaMod API18 отклонил регистрацию KHook; плагин не загружен.
cvar_unavailable = Не удалось зарегистрировать ссылку mp_timelimit; плагин не загружен.
unload_busy = Callback SlowAnimationFix активен или KHook недоступен; выгрузка отклонена.
map_invalid = Имя карты отсутствует или содержит недопустимые символы; перезагрузка отключена.
reloading = Пустой сервер: перезагрузка текущей карты для сброса времени анимаций.
restoring = Восстановлено оставшееся время mp_timelimit после перезагрузки той же карты.
